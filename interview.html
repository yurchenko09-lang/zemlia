<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Співбесіда — Природничі науки: Земля</title>
<link rel="stylesheet" href="css/style.css">
<style>
.chat{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.ai{align-self:flex-start;background:#f1f5ec;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:#fdf3ee;color:var(--warn);border:1px solid #f0c9b8;font-size:14px;font-weight:600;padding:6px 12px}
.typing{align-self:flex-start;color:var(--mut);font-size:14px;padding:4px 6px}
.typing i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--acc2);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer textarea{min-height:90px}
.cnt{font-size:12px;color:var(--mut)}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:600;cursor:pointer}.chk input{margin-top:5px;flex:none}
</style>
</head>
<body class="nosel">
<div class="wrap">
  <header class="top"><h1 id="htitle">Співбесіда</h1><span class="sp"></span><span class="timer" id="timer" style="display:none"></span></header>
  <div id="demo"></div>
  <div class="alert" id="alert"></div>
  <div id="app"><div class="card">Завантаження…</div></div>
</div>
<div class="net" id="net"></div>
<script type="module" src="js/interview.js"></script>
</body>
</html>
