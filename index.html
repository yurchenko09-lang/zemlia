<!doctype html>
<html lang="uk">
<head>

<title>Природничі науки: Земля</title>

<body class="nosel">
<div class="wrap">

  <h3 style="margin-top:0">Перейти до питань?</h3>
  <p>Після цього текст блоку <b>зникне</b>, і повернутися до нього буде неможливо.</p>
  <p class="hint">Якщо під час відповідей доведеться піти (тривога, світло), просто закрийте сторінку. Коли повернетеся, продовжите з цього місця, але питання будуть інші.</p>
  <div class="row"><button class="sec" data-act="closeModal">Ще почитаю</button><span class="sp"></span><button data-act="toQuiz">Так, до питань</button></div>
</div></div>
<div class="net" id="net"></div>
