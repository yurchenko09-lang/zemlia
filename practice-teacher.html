<title>Практичні роботи — кабінет викладача</title>
<link rel="stylesheet" href="css/style.css">
<style>.wrap{max-width:1150px}
.tp{border:1px solid var(--line)}.tp.on{border-color:var(--acc2);background:#f7faf3}
.chk{display:inline-flex;gap:6px;align-items:center;font-weight:400;margin:4px 12px 4px 0}
code{background:#eef1ea;padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
tr.clk{cursor:pointer}tr.clk:hover{background:#f7f9f4}tr.none td{color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.st-ok{background:#d8ecd0;color:var(--ok)}.pill.st-warn{background:#fff0c7;color:#7a5600}.pill.st-off{background:#eceee9;color:var(--mut)}
details.proto{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;background:#fff}details.proto>summary{cursor:pointer}
.ex{background:#fbfcf9;border:1px dashed var(--acc2);border-radius:10px;padding:10px 12px}
</style>
</head>
